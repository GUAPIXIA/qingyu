name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 类型检查 + 单元测试 + Electron 主进程编译验证
  test:
    name: Type check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        run: pnpm check

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Electron main process build (esbuild)
        run: node electron-build.mjs

  # Lint：当前存量 152 个错误（多为历史 no-explicit-any），允许失败避免阻塞
  # TODO: 修复存量问题后移除 continue-on-error
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  # Windows 安装包构建（仅 main 分支推送时）
  build-windows:
    name: Build Windows installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (electron-builder NSIS)
        run: pnpm electron:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-win-x64
          path: release-v2/*.exe
          if-no-files-found: error
