name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  relay-lint-and-unit:
    name: Relay (type check / unit / tenant isolation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qingyu_relay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Relay type check
        run: pnpm --filter @qingyu/relay-server check
      - name: Relay unit tests
        run: pnpm --filter @qingyu/relay-server test
      - name: Apply Relay migrations
        env:
          PGPASSWORD: postgres
        run: for f in relay-server/migrations/*.sql; do psql -h 127.0.0.1 -U postgres -d qingyu_relay -v ON_ERROR_STOP=1 -f "$f"; done
      - name: RLS cross-tenant release gate
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d qingyu_relay -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO relay_spaces(id) VALUES ('00000000-0000-4000-8000-00000000000a'), ('00000000-0000-4000-8000-00000000000b');
          INSERT INTO cached_sessions(space_id,session_id,revision,payload,updated_at,expires_at)
          VALUES ('00000000-0000-4000-8000-00000000000a','a',1,'{}',now(),now()+interval '1 day'),
                 ('00000000-0000-4000-8000-00000000000b','b',1,'{}',now(),now()+interval '1 day');
          SET ROLE qingyu_relay_app;
          BEGIN;
          SELECT set_config('app.space_id','00000000-0000-4000-8000-00000000000a',true);
          DO $$ BEGIN IF (SELECT count(*) FROM cached_sessions) <> 1 THEN RAISE EXCEPTION 'RLS isolation failed'; END IF; END $$;
          ROLLBACK;
          SQL

  # 类型检查 + 单元测试 + Electron 主进程编译验证
  test:
    name: Type check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        run: pnpm check

      - name: Unit tests (vitest, with coverage gate)
        # E1 修复：启用覆盖率统计——vitest.config.ts 的 thresholds 门禁此前从未在 CI 执行，
        # 覆盖率下降不会红；--coverage 使阈值生效（实测 29/47/72 高于阈值 15/35/65）
        run: pnpm test:coverage

      - name: Electron main process build (esbuild)
        run: node electron-build.mjs

      # 依赖安全审计：critical 硬门禁（当前为 0，回归即红）
      # 注：仍有 ~14 个 high 存量（electron-builder 构建链的传递依赖：tar/ini/brace-expansion），
      # 仅影响打包工具不影响运行时，待上游修复后逐步收紧。npmjs 官方源用于审计（npmmirror 无 audit 端点）。
      - name: Dependency audit (critical gate)
        run: pnpm audit --registry=https://registry.npmjs.org --audit-level=critical

  # Lint：已清零存量错误（2026-08 清理 125 个），现在硬性门禁
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  # Windows 安装包构建（仅 main 分支推送时）
  build-windows:
    name: Build Windows installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 版本单源门禁（A-01）：构建前校验 PC package.json / Android TOML / android README / CHANGELOG 一致，
      # 不一致即失败（version.mjs status 退出码 1）
      - name: Version consistency gate
        run: node scripts/version.mjs status

      - name: Build (electron-builder NSIS)
        run: pnpm electron:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-win-x64
          path: release-v2/*.exe
          if-no-files-found: error

  # 依赖安全审计（供应链风险扫描）
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high severity)
        run: pnpm audit --audit-level high

  # Android 伴侣端门禁（阶段 G-05）：
  # 版本一致性（version.mjs status）前置 -> 单测 -> lint -> debug 构建。
  # Linux 无中文路径问题，无需 GBK jvmargs（本地 Windows 构建才需要）。
  android:
    name: Android (unit test / lint / assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency gate (A-01)
        run: node scripts/version.mjs status

      - name: Unit tests (JVM)
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug --console=plain --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
