name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # 类型检查 + 单元测试 + Electron 主进程编译验证
  test:
    name: Type check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # shared 子模块提供 shared/** 源码与跨端契约

      - name: Verify submodules
        run: |
          test -d shared/chat-core || { echo "::error::shared 子模块缺失：检查 .gitmodules 与仓库访问权限（qingyu-shared）"; exit 1; }
          git submodule status --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc)
        run: pnpm check

      - name: Unit tests (vitest, with coverage gate)
        # E1 修复：启用覆盖率统计——vitest.config.ts 的 thresholds 门禁此前从未在 CI 执行，
        # 覆盖率下降不会红；--coverage 使阈值生效（实测 29/47/72 高于阈值 15/35/65）
        run: pnpm test:coverage

      - name: Electron main process build (esbuild)
        run: node electron-build.mjs

      # 依赖安全审计：critical 硬门禁（当前为 0，回归即红）
      # 注：仍有 ~14 个 high 存量（electron-builder 构建链的传递依赖：tar/ini/brace-expansion），
      # 仅影响打包工具不影响运行时，待上游修复后逐步收紧。npmjs 官方源用于审计（npmmirror 无 audit 端点）。
      - name: Dependency audit (critical gate)
        run: pnpm audit --registry=https://registry.npmjs.org --audit-level=critical

  # Lint：已清零存量错误（2026-08 清理 125 个），现在硬性门禁
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # ESLint 扫描范围包含 shared/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  # 结构边界与写路径门禁（阶段 5）：
  # 转发层残余、写路径绕过、跨目录依赖方向（shared 平台依赖 / PC↔画板 / core 纯度 / features 交叉与环）
  # 以及边界检查负例自检——人为违例必须使检查失败。
  gates:
    name: Structure gates (forwarders / write-path / boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # 边界扫描覆盖 shared/ 与 spatial-board/src

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Structure gates
        run: pnpm check:gates

      - name: spatial-core purity
        run: pnpm check:spatial-core

      # 外部 Agent 工具门禁：动作目录 ↔ shared/ipc-api.ts 契约漂移。
      # 与 check:gates 并列执行、结果分别记录（方案 §10）。该门禁为纯 Node，无 GUI 依赖，
      # 可在 Linux runner 运行。
      - name: pc-agent catalog gate
        run: pnpm check:pc-agent

      # 契约漂移门禁（阶段 1）：schemas/fixtures 可解析、settings_public 无敏感字段、
      # openapi operationId 唯一，且 entityType 集合与 shared/contracts/sync-envelope.ts 的
      # SyncEntityType 双向一致。
      # 历史：本门禁曾因脚本硬编码清单与 D-11/D-12 冻结契约脱节而长期"已知红"、未接入 CI；
      # 2026-10-05 改为从契约源头派生比对（含比对函数自检）后转绿并纳入 CI，防止再次静默过期。
      - name: contracts drift gate
        run: pnpm check:contracts

  # Windows 安装包构建（仅 main 分支推送时）
  build-windows:
    name: Build Windows installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vite 多入口构建需要 shared 与 spatial-board

      - name: Verify submodules
        shell: pwsh
        run: |
          if (-not (Test-Path 'shared/chat-core')) { throw "shared 子模块缺失：检查 .gitmodules 与仓库访问权限（qingyu-shared）" }
          git submodule status --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 版本单源门禁（A-01）：构建前校验 package.json 与 CHANGELOG.md 一致，
      # 不一致即失败（version.mjs status 退出码 1）
      - name: Version consistency gate
        run: node scripts/version.mjs status

      - name: Build (electron-builder NSIS)
        run: pnpm electron:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingyu-win-x64
          path: release-v2/*.exe
          if-no-files-found: error

  # 依赖安全审计（供应链风险扫描）
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high severity)
        run: pnpm audit --audit-level high
