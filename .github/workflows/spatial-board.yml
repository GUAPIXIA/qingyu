name: Spatial Board

on:
  push:
    paths:
      - 'spatial-board/**'
      - 'packages/spatial-core/**'
      - '.github/workflows/spatial-board.yml'
  pull_request:
    paths:
      - 'spatial-board/**'
      - 'packages/spatial-core/**'
      - '.github/workflows/spatial-board.yml'

jobs:
  standalone-checks:
    name: Standalone tests and browser regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spatial-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spatial-board/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - run: npm run build

      # 浏览器回归在 CI 上的失败无法本地复现，失败时把截图与日志留成工件以便定位
      - name: Upload browser-regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-board-browser-failure
          path: spatial-board/output/playwright/
          if-no-files-found: ignore
