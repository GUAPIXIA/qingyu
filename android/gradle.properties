org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 保留 AGP 路径检查兼容设置，项目现位于 D:\Code\qingyu
android.overridePathCheck=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# Windows 双守护进程下 immutable workspace 重命名互锁（E-05 构建期稳定），回退普通缓存
org.gradle.unsafe.immutable-workspaces=false

# 阶段 5 U-10：总方案 §11.1 要求 Android 8（API 26）一档必须跑 instrumentation，
# 而 Gradle Managed Devices 默认拒绝 API ≤26。开这个实验开关保住那一档，
# 而不是悄悄把 26 从设备矩阵里删掉（那等于把最低支持版本从门禁里消失）。
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true
