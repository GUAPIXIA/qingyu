<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻语 · 公告管理</title>
<style>
  /* ============================================================
     轻语 · 公告管理 — 编辑部暗色美学
     炭墨底色 · 琥珀金强调（轻语品牌色）· 宋体标题 · 等宽数字
     ============================================================ */
  :root {
    --bg: #0e1013;
    --bg-soft: #14171c;
    --card: #1a1e24;
    --card-2: #1f242c;
    --border: #2a3038;
    --border-soft: #232931;
    --text: #e9e6df;
    --text-soft: #a8a39a;
    --text-muted: #6b675f;
    --accent: #f0b867;          /* 轻语琥珀金 */
    --accent-strong: #ffce8a;
    --accent-soft: rgba(240, 184, 103, .10);
    --danger: #e06b6b;
    --danger-soft: rgba(224, 107, 107, .10);
    --success: #7cc48a;
    --success-soft: rgba(124, 196, 138, .10);
    --info: #7db4d6;
    --radius: 12px;
    --radius-sm: 8px;
    --font-display: "Songti SC", "Noto Serif CJK SC", "STSong", "SimSun", serif;
    --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    /* 网格纹理 + 顶部光晕氛围 */
    background-image:
      linear-gradient(rgba(240,184,103,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,184,103,.025) 1px, transparent 1px),
      radial-gradient(ellipse 80% 40% at 50% -10%, rgba(240,184,103,.07), transparent 70%);
    background-size: 44px 44px, 44px 44px, 100% 100%;
    line-height: 1.6;
  }
  /* 细噪点质感 */
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 999;
    opacity: .35;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  }
  .container { max-width: 1024px; margin: 0 auto; padding: 32px 24px 64px; }

  .brand {
    display: flex; align-items: baseline; gap: 10px;
    user-select: none;
  }
  .brand-mark {
    width: 34px; height: 34px; flex-shrink: 0; align-self: center;
    border-radius: 9px;
    background: linear-gradient(145deg, var(--accent), #c98f3e);
    display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 700; font-size: 17px;
    color: #17130b;
    box-shadow: 0 0 0 1px rgba(240,184,103,.3), 0 6px 18px -6px rgba(240,184,103,.45);
  }
  .brand-name { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: .12em; }
  .brand-sub { font-size: 11px; color: var(--text-muted); letter-spacing: .18em; text-transform: uppercase; }

  /* ---------- 登录页 ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-box {
    width: 100%; max-width: 400px;
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px 36px;
    position: relative;
    box-shadow: 0 24px 64px -24px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
    animation: rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .login-box::before {
    content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
    background: radial-gradient(ellipse 60% 35% at 50% 0%, rgba(240,184,103,.08), transparent 70%);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .login-box .brand { justify-content: center; margin-bottom: 8px; }
  .login-title { font-family: var(--font-display); font-size: 20px; text-align: center; margin: 18px 0 4px; letter-spacing: .06em; }
  .login-sub { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 28px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-soft); margin-bottom: 7px; letter-spacing: .05em; }
  .form-group input {
    width: 100%; padding: 11px 14px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text); font-size: 14px; font-family: var(--font-body);
    outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .form-group input::placeholder { color: var(--text-muted); }
  .form-group input:focus {
    border-color: rgba(240,184,103,.55);
    box-shadow: 0 0 0 3px rgba(240,184,103,.12);
    background: #161a20;
  }
  .error-msg {
    display: none;
    background: var(--danger-soft); color: var(--danger);
    padding: 9px 12px; border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 14px;
    border: 1px solid rgba(224,107,107,.2);
  }
  .success-msg {
    background: var(--success-soft); color: var(--success);
    padding: 9px 12px; border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 14px;
    border: 1px solid rgba(124,196,138,.2);
  }

  /* ---------- 按钮 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 20px; border-radius: var(--radius-sm);
    font-size: 13.5px; font-weight: 500; font-family: var(--font-body);
    cursor: pointer; border: 1px solid transparent;
    transition: all .18s ease; letter-spacing: .02em;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(145deg, var(--accent-strong), var(--accent));
    color: #17130b; font-weight: 600;
    box-shadow: 0 4px 14px -4px rgba(240,184,103,.4);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px -4px rgba(240,184,103,.55); filter: brightness(1.05); }
  .btn-ghost {
    background: transparent; color: var(--text-soft);
    border-color: var(--border);
  }
  .btn-ghost:hover:not(:disabled) { background: var(--accent-soft); color: var(--text); border-color: rgba(240,184,103,.3); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(224,107,107,.25); }
  .btn-danger:hover:not(:disabled) { background: rgba(224,107,107,.18); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  /* ---------- 顶栏 ---------- */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; margin-bottom: 28px;
    border-bottom: 1px solid var(--border-soft);
    animation: rise .5s .05s cubic-bezier(.2,.8,.2,1) both;
  }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .header-right span { font-size: 12.5px; color: var(--text-muted); }
  .admin-chip {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--text-soft);
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--card);
  }
  .admin-chip::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--success); box-shadow: 0 0 8px rgba(124,196,138,.6);
  }

  /* ---------- 统计条（Bento） ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 20px;
    animation: rise .5s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  .stat {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    position: relative; overflow: hidden;
    transition: border-color .2s, transform .2s;
  }
  .stat:hover { border-color: rgba(240,184,103,.35); transform: translateY(-1px); }
  .stat-label { font-size: 11px; color: var(--text-muted); letter-spacing: .12em; }
  .stat-value {
    font-family: var(--font-mono); font-size: 26px; font-weight: 600;
    margin-top: 6px; letter-spacing: .02em;
  }
  .stat-value.accent { color: var(--accent); }
  .stat-value.success { color: var(--success); }
  .stat-value.danger { color: var(--danger); }
  .stat-value.info { color: var(--info); }
  .stat::after {
    content: ""; position: absolute; right: -20px; top: -20px;
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle, rgba(240,184,103,.06), transparent 70%);
  }

  /* ---------- 面板 ---------- */
  .panel {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow: hidden;
    animation: rise .5s .15s cubic-bezier(.2,.8,.2,1) both;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; cursor: pointer;
    border-bottom: 1px solid var(--border-soft);
    transition: background .2s;
  }
  .panel-head:hover { background: rgba(255,255,255,.015); }
  .panel-title {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: .04em;
  }
  .panel-title .icon { font-size: 15px; }
  .panel-toggle {
    font-size: 11px; color: var(--text-muted);
    transition: transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .panel-body { padding: 20px; display: grid; gap: 18px; }
  .panel-section-label {
    font-size: 10.5px; color: var(--text-muted);
    letter-spacing: .18em; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .panel-section-label::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }
  .version-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  .version-col {
    background: var(--bg-soft); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 16px;
  }
  .version-col-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 600; color: var(--text-soft);
    margin-bottom: 14px;
  }
  .version-col-head .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 6px rgba(240,184,103,.5);
  }
  .version-col-head .dot.pc { background: var(--info); box-shadow: 0 0 6px rgba(125,180,214,.5); }
  textarea, .modal input[type=text], .modal input[type=password] {
    width: 100%; padding: 10px 12px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text); font-size: 13.5px; font-family: var(--font-body);
    outline: none; resize: vertical;
    transition: border-color .2s, box-shadow .2s;
  }
  textarea:focus, .modal input:focus {
    border-color: rgba(240,184,103,.55);
    box-shadow: 0 0 0 3px rgba(240,184,103,.12);
  }
  .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
    animation: rise .5s .2s cubic-bezier(.2,.8,.2,1) both;
  }
  .toolbar-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: .04em; }
  .toolbar-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  /* ---------- 公告列表 ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .list-item {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 18px;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    transition: border-color .2s, transform .2s, background .2s;
    animation: rise .4s cubic-bezier(.2,.8,.2,1) both;
  }
  .list-item:hover { border-color: rgba(240,184,103,.35); background: var(--card-2); transform: translateX(2px); }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item .meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-family: var(--font-mono); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 600; letter-spacing: .08em;
    vertical-align: middle; margin-right: 6px;
  }
  .badge-pinned { background: var(--accent-soft); color: var(--accent); }
  .badge-draft { background: rgba(122,116,145,.15); color: var(--text-muted); }
  .empty, .loading {
    text-align: center; padding: 56px 16px; color: var(--text-muted); font-size: 13px;
  }
  .spinner {
    display: inline-block; width: 22px; height: 22px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 弹窗 ---------- */
  .overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(8,10,12,.7);
    backdrop-filter: blur(6px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.active { display: flex; }
  .modal {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 720px; max-width: 100%; max-height: 90vh; overflow-y: auto;
    padding: 26px 28px;
    box-shadow: 0 32px 80px -24px rgba(0,0,0,.7);
    animation: modalIn .28s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
  .modal h2 { font-family: var(--font-display); font-size: 17px; margin-bottom: 20px; letter-spacing: .04em; }
  .checks { display: flex; gap: 22px; margin: 14px 0; }
  .checks label {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--text-soft); cursor: pointer;
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 999px;
    transition: all .2s; user-select: none;
  }
  .checks label:hover { border-color: rgba(240,184,103,.35); }
  .checks label:has(input:checked) {
    border-color: rgba(240,184,103,.5); background: var(--accent-soft); color: var(--text);
  }
  .checks input[type=checkbox] { accent-color: var(--accent); }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;
    padding-top: 18px; border-top: 1px solid var(--border-soft);
  }
  .modal-footer .spacer { flex: 1; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a424d; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .version-grid { grid-template-columns: 1fr; }
    .header { flex-wrap: wrap; gap: 12px; }
  }
</style>
</head>
<body>

<!-- ===================== 登录页 ===================== -->
<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <div class="brand"><div class="brand-mark">轻</div></div>
    <h1 class="login-title">轻语 · 公告管理</h1>
    <p class="login-sub">服务端公告与版本配置 · 仅限管理员</p>
    <div id="loginError" class="error-msg"></div>
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" style="width:100%" id="btnLogin" onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- ===================== 管理页 ===================== -->
<div id="adminPage" class="container" style="display:none">
  <div class="header">
    <div class="brand">
      <div class="brand-mark">轻</div>
      <div>
        <div class="brand-name">公告管理</div>
        <div class="brand-sub">Qingyu Console</div>
      </div>
    </div>
    <div class="header-right">
      <span class="admin-chip" id="adminName">管理员</span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">退出</button>
    </div>
  </div>

  <div id="adminMsg"></div>

  <!-- 统计条 -->
  <div class="stats">
    <div class="stat"><div class="stat-label">全部公告</div><div class="stat-value info" id="statTotal">–</div></div>
    <div class="stat"><div class="stat-label">已发布</div><div class="stat-value success" id="statPublished">–</div></div>
    <div class="stat"><div class="stat-label">草稿</div><div class="stat-value danger" id="statDraft">–</div></div>
    <div class="stat"><div class="stat-label">置顶</div><div class="stat-value accent" id="statPinned">–</div></div>
  </div>

  <!-- 版本管理 -->
  <div class="panel">
    <div class="panel-head" onclick="toggleVersionPanel()">
      <span class="panel-title"><span class="icon">◈</span>版本管理</span>
      <span class="panel-toggle" id="versionToggleIcon">▾</span>
    </div>
    <div id="versionBody" class="panel-body" style="display:block">
      <div class="version-grid">
        <div class="version-col">
          <div class="version-col-head"><span class="dot pc"></span>PC 端（Electron 客户端）</div>
          <div class="form-group">
            <label>最新版本号</label>
            <input type="text" id="editVersion" placeholder="0.8.1" style="font-family:var(--font-mono)">
          </div>
          <div class="form-group">
            <label>下载地址</label>
            <input type="text" id="editDownloadUrl" placeholder="https://github.com/GUAPIXIA/qingyu/releases">
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>更新日志（Markdown）</label>
            <textarea id="editChangelog" style="min-height:110px" placeholder="支持 Markdown 格式..."></textarea>
          </div>
        </div>
        <div class="version-col">
          <div class="version-col-head"><span class="dot"></span>安卓端（qingyu-companion）</div>
          <div class="form-group">
            <label>最新版本号</label>
            <input type="text" id="editAndroidVersion" placeholder="0.1.2" style="font-family:var(--font-mono)">
          </div>
          <div class="form-group">
            <label>下载地址（APK）</label>
            <input type="text" id="editAndroidDownloadUrl" placeholder="https://example.com/qingyu-companion-v0.1.2.apk">
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>更新日志（Markdown）</label>
            <textarea id="editAndroidChangelog" style="min-height:110px" placeholder="支持 Markdown 格式..."></textarea>
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
        <button class="btn btn-primary btn-sm" onclick="saveVersion()">保存版本配置</button>
        <span id="versionSaveMsg" style="font-size:12px"></span>
      </div>
    </div>
  </div>

  <!-- 公告列表 -->
  <div class="toolbar">
    <div>
      <div class="toolbar-title">公告列表</div>
      <div class="toolbar-sub">共 <span id="listCount">0</span> 条 · 点击条目可编辑</div>
    </div>
    <button class="btn btn-primary" onclick="openEditor()">＋ 新建公告</button>
  </div>
  <div id="listContainer"></div>
</div>

<!-- ===================== 编辑弹窗 ===================== -->
<div id="editorOverlay" class="overlay">
  <div class="modal">
    <h2 id="editorTitle">新建公告</h2>
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="editTitle" placeholder="公告标题">
    </div>
    <div class="form-group">
      <label>摘要</label>
      <input type="text" id="editSummary" placeholder="简短摘要（可选）">
    </div>
    <div class="form-group">
      <label>内容（Markdown）</label>
      <textarea id="editContent" class="md-content" style="min-height:140px" placeholder="支持 Markdown 格式..."></textarea>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="editPinned"> 置顶</label>
      <label><input type="checkbox" id="editPublished" checked> 发布</label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="btnDelete" style="display:none" onclick="doDelete()">删除</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost" onclick="closeEditor()">取消</button>
      <button class="btn btn-primary" id="btnSave" onclick="doSave()">保存</button>
    </div>
  </div>
</div>

<script>
let token = localStorage.getItem('tavern_admin_token')
let editId = null

if (token) { showAdmin(); loadList(); loadVersionConfig() }
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() })

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim()
  const p = document.getElementById('loginPass').value.trim()
  const btn = document.getElementById('btnLogin')
  if (!u || !p) return showLoginError('请输入用户名和密码')
  btn.disabled = true; btn.textContent = '登录中…'
  try {
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p}) })
    const data = await res.json()
    if (!res.ok) { showLoginError(data.error || '登录失败'); btn.disabled = false; btn.textContent = '登 录'; return }
    token = data.token
    localStorage.setItem('tavern_admin_token', token)
    hideLoginError()
    showAdmin()
    loadList()
    loadVersionConfig()
  } catch {
    showLoginError('网络错误，请检查连接')
    btn.disabled = false; btn.textContent = '登 录'
  }
}

function showLoginError(msg) {
  const el = document.getElementById('loginError')
  el.textContent = msg; el.style.display = 'block'
}
function hideLoginError() { document.getElementById('loginError').style.display = 'none' }

function showAdmin() {
  document.getElementById('loginPage').style.display = 'none'
  document.getElementById('adminPage').style.display = 'block'
  document.getElementById('adminName').textContent = '管理员'
}
function logout() { localStorage.removeItem('tavern_admin_token'); token = null; location.reload() }

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' }
  if (token) headers['Authorization'] = 'Bearer ' + token
  const opts = { method, headers }
  if (body) opts.body = JSON.stringify(body)
  const res = await fetch(path, opts)
  // 401 令牌失效 → 回登录页
  if (res.status === 401) {
    localStorage.removeItem('tavern_admin_token'); token = null
    document.getElementById('adminPage').style.display = 'none'
    document.getElementById('loginPage').style.display = ''
    throw new Error('登录已过期，请重新登录')
  }
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || '请求失败')
  return data
}

async function loadList() {
  const container = document.getElementById('listContainer')
  container.innerHTML = '<div class="loading"><div class="spinner"></div></div>'
  try {
    const { items } = await api('GET', '/api/announcements/admin?pageSize=100')
    document.getElementById('listCount').textContent = items.length
    renderStats(items)
    if (items.length === 0) {
      container.innerHTML = '<div class="empty">暂无公告，点击「＋ 新建公告」开始</div>'
      return
    }
    container.innerHTML = '<div class="list">' + items.map((a, i) => `
      <div class="list-item" style="animation-delay:${Math.min(i * 30, 300)}ms" onclick="openEditor(${a.id})">
        <div class="info">
          <div class="title">
            ${a.pinned ? '<span class="badge badge-pinned">置顶</span>' : ''}
            ${!a.published ? '<span class="badge badge-draft">草稿</span>' : ''}
            ${escapeHtml(a.title)}
          </div>
          <div class="meta">${formatDate(a.updatedAt)} · ${escapeHtml(a.summary || '（无摘要）')}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditor(${a.id})">编辑</button>
      </div>
    `).join('') + '</div>'
  } catch(e) {
    container.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>'
  }
}

function renderStats(items) {
  document.getElementById('statTotal').textContent = items.length
  document.getElementById('statPublished').textContent = items.filter(a => a.published).length
  document.getElementById('statDraft').textContent = items.filter(a => !a.published).length
  document.getElementById('statPinned').textContent = items.filter(a => a.pinned).length
}

function formatDate(iso) {
  if (!iso) return '—'
  const d = new Date(iso)
  if (isNaN(d)) return iso
  const p = n => String(n).padStart(2, '0')
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

function openEditor(id) {
  editId = id
  document.getElementById('editorOverlay').classList.add('active')
  document.getElementById('btnDelete').style.display = id ? 'inline-flex' : 'none'
  document.getElementById('editorTitle').textContent = id ? '编辑公告' : '新建公告'
  document.getElementById('editTitle').value = ''
  document.getElementById('editSummary').value = ''
  document.getElementById('editContent').value = ''
  document.getElementById('editPinned').checked = false
  document.getElementById('editPublished').checked = true
  if (id) {
    api('GET', '/api/announcements/admin/' + id).then(a => {
      document.getElementById('editTitle').value = a.title
      document.getElementById('editSummary').value = a.summary || ''
      document.getElementById('editContent').value = a.content
      document.getElementById('editPinned').checked = !!a.pinned
      document.getElementById('editPublished').checked = !!a.published
    })
  }
}

function closeEditor() { document.getElementById('editorOverlay').classList.remove('active'); editId = null }

async function doSave() {
  const title = document.getElementById('editTitle').value.trim()
  const content = document.getElementById('editContent').value.trim()
  if (!title || !content) return alert('标题和内容不能为空')
  const btn = document.getElementById('btnSave')
  btn.disabled = true
  const body = {
    title,
    content,
    summary: document.getElementById('editSummary').value.trim(),
    pinned: document.getElementById('editPinned').checked,
    published: document.getElementById('editPublished').checked
  }
  try {
    if (editId) { await api('PUT', '/api/announcements/' + editId, body) }
    else { await api('POST', '/api/announcements', body) }
    closeEditor()
    loadList()
  } catch(e) { alert('保存失败: ' + e.message) }
  btn.disabled = false
}

async function doDelete() {
  if (!confirm('确定删除此公告？')) return
  try {
    await api('DELETE', '/api/announcements/' + editId)
    closeEditor()
    loadList()
  } catch(e) { alert('删除失败: ' + e.message) }
}

// ==================== 版本管理 ====================
let versionExpanded = true
function toggleVersionPanel() {
  versionExpanded = !versionExpanded
  document.getElementById('versionBody').style.display = versionExpanded ? 'block' : 'none'
  document.getElementById('versionToggleIcon').textContent = versionExpanded ? '▾' : '▸'
}

async function loadVersionConfig() {
  try {
    const data = await fetch('/api/version').then(r => r.json())
    document.getElementById('editVersion').value = data.version || ''
    document.getElementById('editChangelog').value = data.changelog || ''
    document.getElementById('editDownloadUrl').value = data.downloadUrl || ''
    document.getElementById('editAndroidVersion').value = data.androidVersion || ''
    document.getElementById('editAndroidChangelog').value = data.androidChangelog || ''
    document.getElementById('editAndroidDownloadUrl').value = data.androidDownloadUrl || ''
  } catch { /* 静默失败 */ }
}

async function saveVersion() {
  const msg = document.getElementById('versionSaveMsg')
  try {
    const body = {
      version: document.getElementById('editVersion').value.trim(),
      changelog: document.getElementById('editChangelog').value.trim(),
      downloadUrl: document.getElementById('editDownloadUrl').value.trim(),
      androidVersion: document.getElementById('editAndroidVersion').value.trim(),
      androidChangelog: document.getElementById('editAndroidChangelog').value.trim(),
      androidDownloadUrl: document.getElementById('editAndroidDownloadUrl').value.trim(),
    }
    await api('PUT', '/api/version', body)
    msg.textContent = '✓ 已保存'
    msg.style.color = 'var(--success)'
    setTimeout(() => { msg.textContent = '' }, 2200)
  } catch (e) {
    msg.textContent = '✕ ' + e.message
    msg.style.color = 'var(--danger)'
  }
}
</script>
